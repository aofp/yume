name: Publish Pages

# Manual recovery avoids racing the automatic branch-based Pages deployment.
on:
  workflow_dispatch:

concurrency:
  group: pages-recovery
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Validate release metadata
        run: |
          node <<'NODE'
          const assert = require('node:assert/strict');
          const fs = require('node:fs');
          const version = fs.readFileSync('version.txt', 'utf8').trim();
          const manifest = JSON.parse(fs.readFileSync('releases/releases.json', 'utf8'));
          const release = manifest.releases[0];
          assert.match(version, /^\d+\.\d+\.\d+$/);
          assert.equal(manifest.latest, version, 'manifest latest matches version.txt');
          assert.equal(release.version, version, 'first release matches version.txt');
          for (const platform of ['mac_arm', 'mac', 'windows_arm', 'windows', 'linux_deb_arm', 'linux_deb', 'linux_rpm_arm', 'linux_rpm']) {
            assert.equal(typeof release.downloads?.[platform], 'string', `missing download: ${platform}`);
            assert.ok(release.downloads[platform].trim(), `empty download: ${platform}`);
            assert.match(release.checksums?.[platform] || '', /^[a-f0-9]{64}$/i, `invalid checksum: ${platform}`);
          }
          console.log(`validated release ${version} for all eight platforms`);
          NODE

      - name: Upload site
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: '.'

      - name: Deploy site
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
